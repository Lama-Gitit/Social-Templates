<!-- Template for the plugin UI. Do not edit figma-plugin/ui.html directly —
     run `npm run build:figma` to regenerate it from this file with the
     catalog injected from src/data/platforms.ts. -->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #050506;
    color: #fff;
    font-family: 'Inter', 'Helvetica Neue', sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .search-wrap { padding: 12px 12px 8px; }
  #search {
    width: 100%;
    padding: 9px 12px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.15);
    color: #fff;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    outline: none;
  }
  #search:focus { border-color: rgba(255,255,255,0.4); }
  #search::placeholder { color: rgba(255,255,255,0.35); }
  #list { flex: 1; overflow-y: auto; padding-bottom: 8px; }
  .platform-header {
    padding: 12px 14px 6px;
    font-size: 9px;
    font-weight: 900;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.45);
  }
  .row {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 8px 14px;
    background: none;
    border: none;
    color: #fff;
    cursor: pointer;
    text-align: left;
  }
  .row:hover { background: rgba(255,255,255,0.05); }
  .shape-box {
    flex-shrink: 0;
    width: 26px;
    height: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .shape { border-width: 2px; border-style: solid; }
  .row .label {
    flex: 1;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }
  .row .dims {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: rgba(255,255,255,0.5);
  }
  .empty {
    padding: 24px 14px;
    text-align: center;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.5);
  }
</style>

<div class="search-wrap">
  <input id="search" type="text" placeholder="Search formats..." />
</div>
<div id="list"></div>

<script>
  // Injected at build time from src/data/platforms.ts — single source of truth.
  const CATALOG = /*__CATALOG__*/[];

  const list = document.getElementById('list');
  const search = document.getElementById('search');

  function shapeStyle(t, color) {
    const ratio = t.width / t.height;
    const size = ratio > 1 ? { width: '22px', height: (22 / ratio) + 'px' } : { width: (22 * ratio) + 'px', height: '22px' };
    return `width:${size.width};height:${size.height};border-color:${color}B8;background:${color}28;` +
      (t.category === 'profile' ? 'border-radius:50%;' : '');
  }

  // Split a string into lowercase word tokens ("X (Twitter)" -> ["x","twitter"]).
  function tokens(s) {
    return s.toLowerCase().split(/[^a-z0-9]+/).filter(Boolean);
  }

  // Every query word must prefix-match a word in the haystack, so "x" finds
  // "X (Twitter)" without matching every label that merely contains an x.
  function matchesQuery(q, haystack) {
    const queryWords = tokens(q);
    const hayWords = tokens(haystack);
    return queryWords.every(qw => hayWords.some(hw => hw.startsWith(qw)));
  }

  function render(query) {
    const q = query.trim().toLowerCase();
    list.innerHTML = '';
    let shown = 0;
    for (const p of CATALOG) {
      const matches = p.templates.filter(t =>
        !q ||
        matchesQuery(q, p.name + ' ' + t.label + ' ' + t.category) ||
        (/\d/.test(q) && (t.width + 'x' + t.height).includes(q))
      );
      if (!matches.length) continue;
      shown += matches.length;

      const header = document.createElement('div');
      header.className = 'platform-header';
      header.textContent = p.name;
      list.appendChild(header);

      for (const t of matches) {
        const row = document.createElement('button');
        row.className = 'row';
        row.innerHTML =
          `<span class="shape-box"><span class="shape" style="${shapeStyle(t, p.brandColor)}"></span></span>` +
          `<span class="label"></span><span class="dims">${t.width}×${t.height}</span>`;
        row.querySelector('.label').textContent = t.label;
        row.onclick = () => parent.postMessage({ pluginMessage: {
          type: 'insert-frame',
          platformName: p.name,
          label: t.label,
          width: t.width,
          height: t.height,
          brandColor: p.brandColor,
        } }, '*');
        list.appendChild(row);
      }
    }
    if (!shown) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'No formats match';
      list.appendChild(empty);
    }
  }

  search.addEventListener('input', () => render(search.value));
  render('');
</script>
